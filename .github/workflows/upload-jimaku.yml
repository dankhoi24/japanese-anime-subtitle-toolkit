name: Upload subtitles to Jimaku

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Select subtitle file(s)"
        required: true
        type: choice
        options:
          - "001"
          - "001-010"
        default: "001"
      mode:
        description: "Preview first; upload publishes subtitles to Jimaku"
        required: true
        type: choice
        options:
          - preview
          - upload
        default: preview
      confirm_rights:
        description: "I have permission to redistribute these subtitles publicly"
        required: true
        type: boolean
        default: false

jobs:
  jimaku:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check files and consent
        shell: bash
        env:
          EPISODES: ${{ inputs.episodes }}
          MODE: ${{ inputs.mode }}
          CONFIRM_RIGHTS: ${{ inputs.confirm_rights }}
        run: |
          set -euo pipefail
          directory="subtitles/chis-sweet-home"
          if [[ "$EPISODES" == "001" ]]; then
            files=("$directory/001.ja.srt")
          elif [[ "$EPISODES" == "001-010" ]]; then
            files=("$directory"/0{01..10}.ja.srt)
          else
            echo "::error::Invalid episode selection"
            exit 1
          fi
          for file in "${files[@]}"; do
            [[ -s "$file" ]] || { echo "::error::Missing subtitle: $file"; exit 1; }
            echo "Found: $file"
          done
          echo "Mode: $MODE; file count: ${#files[@]}"
          if [[ "$MODE" == "upload" && "$CONFIRM_RIGHTS" != "true" ]]; then
            echo "::error::Public upload requires confirmation of redistribution rights"
            exit 1
          fi

      - name: Upload selected subtitles
        if: ${{ inputs.mode == 'upload' && inputs.confirm_rights }}
        shell: bash
        env:
          JIMAKU_API_KEY: ${{ secrets.JIMAKU_API_KEY }}
          EPISODES: ${{ inputs.episodes }}
        run: |
          set -euo pipefail
          [[ -n "$JIMAKU_API_KEY" ]] || { echo "::error::Missing JIMAKU_API_KEY secret"; exit 1; }
          directory="subtitles/chis-sweet-home"
          if [[ "$EPISODES" == "001" ]]; then
            files=("$directory/001.ja.srt")
          else
            files=("$directory"/0{01..10}.ja.srt)
          fi
          form_args=()
          for file in "${files[@]}"; do
            form_args+=(--form "file=@${file};filename=$(basename "$file");type=application/x-subrip")
          done
          curl --fail-with-body --silent --show-error --max-time 120 \
            --request POST \
            --header "Authorization: $JIMAKU_API_KEY" \
            --header "User-Agent: japanese-anime-subtitle-toolkit/1.0" \
            "${form_args[@]}" \
            "https://jimaku.cc/api/entries/1004/upload"
          echo
          echo "Jimaku upload request completed. Verify the files on the anime entry page."
